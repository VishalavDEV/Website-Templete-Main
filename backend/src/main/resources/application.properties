# Database Connection Properties (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:technosprint_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true

# JPA and Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Server Port
server.port=8080

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT Configuration Properties
technosprint.app.jwtSecret=TechnoSprintTemplatesSuperSecretKeyWhichIsAtLeast256BitsLongForHMACSHA256
technosprint.app.jwtExpirationMs=86400000

# Enable console printing for easier debugging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
